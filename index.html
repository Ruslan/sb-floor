const M = DATA.meta;

const WIN = ['с ' + fmtD(M.since), '30 дней', '7 дней'];

function fmtD(s) { const [y, m, d] = s.slice(0, 10).split('-'); return `${d}.${m}`; }
function vendor(c) { return /^AMD/.test(c) ? 'amd' : /^Intel/.test(c) ? 'intel' : ''; }
function shortCpu(c) {
  return c.replace('Intel Xeon ', 'Xeon ').replace('Intel XEON ', 'Xeon ').replace('Intel Core ', 'Core ')
          .replace('AMD Ryzen Threadripper ', 'Threadripper ').replace('AMD ', '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// класс дисков: набор типов без размеров и количества — «NVMe DC + HDD»
const DTAG = { 'DC NVMe': 'NVMe DC', 'SSD NVMe': 'NVMe', 'DC SATA': 'SATA DC', 'SSD SATA': 'SATA SSD', 'HDD': 'HDD' };
const DORDER = Object.values(DTAG);
function diskClass(disks) {
  const t = new Set();
  for (const p of disks.split(' + ')) {
    const m = p.match(/^\d+× [\d.,]+ (?:ТБ|ГБ) (.+)$/);
    if (m) t.add(DTAG[m[1]] || m[1]);
  }
  return t.size ? [...t].sort((a, b) => DORDER.indexOf(a) - DORDER.indexOf(b)).join(' + ') : 'диски не разобраны';
}

// видеопамять — из private/docs/gpu-history.md
const VRAM = { 'GTX 1080': 8, 'RTX 4000 SFF Ada': 20, 'RTX 6000 Ada': 48 };
function diskTB(disks) {
  let t = 0;
  for (const p of disks.split(' + ')) {
    const m = p.match(/^(\d+)× ([\d.,]+) (ТБ|ГБ)/);
    if (m) t += +m[1] * parseFloat(m[2].replace(',', '.')) / (m[3] === 'ГБ' ? 1000 : 1);
  }
  return t || null;
}

            html: l => l.dclass.split(' + ').map(t => `<span class="tag dk">${esc(t)}</span>`).join(''),
            size: l => l.tb, per: l => l.tb, ef: v => `€${fx(v)} / ТБ`, eft: 'лучшее дно за ТБ (сумма всех дисков) внутри класса' },
  disks:  { unit: 'наб. дисков', key: l => l.disks, cmp: (a, b) => a.s[0][0] - b.s[0][0],
            html: l => `<span class="label" title="${esc(l.disks)}">${esc(l.disks === '—' ? 'диски не разобраны' : l.disks)}</span>`,
            size: l => l.tb, per: l => l.tb, ef: v => `€${fx(v)} / ТБ`, eft: 'дно за ТБ, сумма всех дисков без учёта типа' },
};
function clsRank(c) { return c.split(' + ').reduce((a, t) => a * 8 + DORDER.indexOf(t) + 1, 0) + c.split(' + ').length * 1e4; }
function cpuHtml(cpu, gpu, score) {
  const v = vendor(cpu);
  return (v ? `<span class="vendor v-${v}">${v.toUpperCase()}</span>` : '') +
         `<span class="label" title="${esc(cpu)}">${esc(shortCpu(cpu))}</span>` + (gpu ? `<span class="tag gpu">${esc(gpu)}</span>` : '') +
         `<span class="score" title="многопоток, ${SCORE[state.score]}, замер ${M.scoreDate}">${score ? (score / 1000).toFixed(1) + 'k' : 'нет рейтинга'}</span>`;
}

const SLICES = {
  cpu:  { title: 'процессор → память → диски', dims: ['cpuG', 'ram', 'disks'] },
  ram:  { title: 'память → процессор → диски', dims: ['ram', 'cpuG', 'disks'] },
  gpu:  { title: 'GPU → процессор → память → диски', dims: ['gpu', 'cpu', 'ram', 'disks'] },
  disk: { title: 'класс дисков → диски → процессор → память', dims: ['dclass', 'disks', 'cpuG', 'ram'] },
};

// узел = слитые гистограммы листьев; s[i] = [min, лотов по min, всего, висит ли лот по min, лотов у дна]
function agg(node, ls) {
  const h = new Map(), lv = new Map();
  for (const l of ls) {
    for (const [p, a, b, c] of l.hist) { const x = h.get(p); x ? (x[0] += a, x[1] += b, x[2] += c) : h.set(p, [a, b, c]); }
    for (const [p, n] of l.live) lv.set(p, (lv.get(p) || 0) + n);
  }
  node.hist = [...h].sort((a, b) => a[0] - b[0]);
  const floor = node.hist[0][0], edge = floor * (1 + state.band / 100);
  node.s = [0, 1, 2].map(i => {
    const e = node.hist.filter(([, n]) => n[i]);
    if (!e.length) return null;
    const m = e[0][0];
    return [m, e[0][1][i], e.reduce((a, [, n]) => a + n[i], 0), lv.has(m) ? 1 : 0,
            e.filter(([p]) => p <= edge).reduce((a, [, n]) => a + n[i], 0)];
  });
  node.now = lv.size ? Math.min(...lv.keys()) : null;
  node.nowN = node.now == null ? 0 : lv.get(node.now);
  node.wk = M.weeks.map((_, i) => { const w = ls.map(x => x.wk[i]).filter(x => x != null); return w.length ? Math.min(...w) : null; });
  return node;
}

const state = { slice: 'cpu', q: '', sort: 'size', score: 0, band: 5, f: new Set(), open: new Set() };

function filtered() {
  const q = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const f = state.f;
  return LEAVES.filter(l => !(f.has('nogpu') && l.gpu) && !(f.has('gpu') && !l.gpu) && !(f.has('ecc') && !l.ecc) &&
    !(f.has('w7') && !l.has7) && !(f.has('live') && l.now == null) && q.every(t => l.hay.includes(t)));
}

function group(ls, dims, lvl, prefix) {
  const d = DIMS[dims[lvl]], m = new Map();
  for (const l of ls) { const k = d.key(l); if (!m.has(k)) m.set(k, []); m.get(k).push(l); }
  return [...m].map(([val, sub]) => {
    const key = prefix + '|' + val;
    const node = agg({ lvl, dim: dims[lvl], val, s0: sub[0], key }, sub);
    const sz = sub.map(d.size).filter(x => x != null), ef = sub.map(l => d.per(l) ? l.floor / d.per(l) : null).filter(x => x != null);
    node.size = sz.length ? Math.max(...sz) : null;
    node.eff = ef.length ? Math.min(...ef) : null;
    if (lvl < dims.length - 1) { node.kids = group(sub, dims, lvl + 1, key); node.nleaf = sub.length; }
    return node;
  });
}

function build() { return group(filtered(), SLICES[state.slice].dims, 0, state.slice); }

function sortNodes(arr) {
  const gen = {
    floor: (a, b) => a.s[0][0] - b.s[0][0],
    w7: (a, b) => (a.s[2] ? a.s[2][0] : 1e9) - (b.s[2] ? b.s[2][0] : 1e9) || a.s[0][0] - b.s[0][0],
    cnt: (a, b) => b.s[0][2] - a.s[0][2],
    size: (a, b) => (b.size ?? -1) - (a.size ?? -1) || a.s[0][0] - b.s[0][0],
    eff: (a, b) => (a.eff ?? 1e9) - (b.eff ?? 1e9) || a.s[0][0] - b.s[0][0],
  }[state.sort];
  if (arr.length) arr.sort(gen || DIMS[arr[0].dim].cmp);
  for (const n of arr) if (n.kids) sortNodes(n.kids);
  return arr;
}

function priceCell(s, floor, i) {
  if (!s) return `<div class="p none"><div class="v">—</div><div class="m">не было</div></div>`;
  const [m, n, tot, live, near] = s;
  let cls = '', d = '';
  if (i > 0) {
    if (m === floor) { cls = 'floor'; d = 'дно'; }
    else { cls = (m - floor) / floor <= state.band / 100 ? 'near' : 'far'; d = `+€${m - floor}`; }
  }
  const tip = `${WIN[i]}: минимум €${m}, по нему ${n} из ${tot} лот(ов); не дороже дна +${state.band}% — ${near}` +
              (live ? ' · один по минимуму висит сейчас' : '');
  // «у дна» показываем, только если там есть кто-то кроме лотов по самому минимуму окна
  const nr = near > (m === floor ? n : 0) ? `<div class="m nr">у дна ${near}</div>` : '';
  return `<div class="p ${cls}" title="${tip}"><div class="v">${live ? '<i class="dot"></i>' : ''}€${m}</div>` +
         `<div class="m"><span class="x">×${n}</span>` + (d ? ` · <span class="d">${d}</span>` : ` / ${tot}`) + `</div>${nr}</div>`;
}

// распределение цен с начала: от дна до +60%, полоса «у дна» подсвечена, лоты за 7 дней — поверх цветом
function dist(hist) {
  const W = 100, H = 28, SPAN = 60, floor = hist[0][0];
  const step = Math.max(1, 100 / floor);           // бин: 1%, но не меньше €1 — цены целые
  const nb = Math.ceil(SPAN / step) + 1, all = new Array(nb).fill(0), w7 = new Array(nb).fill(0);
  let over = 0, over7 = 0;
  for (const [p, n] of hist) {
    const b = Math.floor((p - floor) / floor * 100 / step);
    if (b >= nb) { over += n[0]; over7 += n[2]; continue; }
    all[b] += n[0]; w7[b] += n[2];
  }
  const mx = Math.sqrt(Math.max(...all, 1)), bw = W / nb;
  const hgt = v => v ? Math.max(2, Math.sqrt(v) / mx * (H - 2)) : 0;
  const band = `<rect x="0" y="0" width="${(state.band / step + 1) * bw}" height="${H}" fill="var(--floor-bg)"/>`;
  const bars = all.map((v, i) => !v ? '' : {
      lo: Math.round(floor * (1 + i * step / 100)), hi: Math.round(floor * (1 + (i + 1) * step / 100)) - 1, v, i }).filter(Boolean)
    .map(b => `<g><title>€${b.lo}${b.hi > b.lo ? '–' + b.hi : ''}: ${b.v} лот(ов)${w7[b.i] ? `, из них ${w7[b.i]} за 7 дней` : ''}</title>` +
      `<rect x="${(b.i * bw).toFixed(1)}" y="${(H - hgt(b.v)).toFixed(1)}" width="${Math.max(1.2, bw - 0.6).toFixed(1)}" height="${hgt(b.v).toFixed(1)}" fill="${(b.lo - floor) / floor <= state.band / 100 ? 'var(--floor)' : 'var(--muted)'}"/>` +
      (w7[b.i] ? `<rect x="${(b.i * bw).toFixed(1)}" y="${(H - hgt(w7[b.i])).toFixed(1)}" width="${Math.max(1.2, bw - 0.6).toFixed(1)}" height="${hgt(w7[b.i]).toFixed(1)}" fill="var(--accent)"/>` : '') + `</g>`).join('');
  const ov = over ? `<text x="${W + 4}" y="${H - 2}" font-size="10" fill="${over7 ? 'var(--accent)' : 'var(--muted)'}"><title>${over} лот(ов) дороже дна больше чем на ${SPAN}%</title>›${over}</text>` : '';
  return `<svg viewBox="0 0 ${W + 34} ${H}">${band}${bars}<line x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}" stroke="var(--line)"/>${ov}</svg>`;
}

function nowCell(node, floor) {
  if (node.now == null) return `<div class="p cur none cur-c"><div class="v">—</div></div>`;
  const hit = node.now === floor;
  return `<div class="p cur cur-c ${hit ? 'hit' : ''}" title="висит сейчас: ${node.nowN} по €${node.now}">` +
         `<div class="v"><i class="dot"></i>€${node.now}</div><div class="m">×${node.nowN}${hit ? ' · дно' : ` · +€${node.now - floor}`}</div></div>`;
}

function spark(wk, floor) {
  const W = 116, H = 28, pad = 3;
  const v = wk.filter(x => x != null);
  if (!v.length) return '';
  const lo = Math.min(...v), hi = Math.max(...v);
  const x = i => pad + i * (W - 2 * pad) / Math.max(1, wk.length - 1);
  const y = p => hi === lo ? H / 2 : pad + (hi - p) * (H - 2 * pad) / (hi - lo);
  let path = '', pen = false;
  wk.forEach((p, i) => { if (p == null) { pen = false; return; } path += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1); pen = true; });
  const dots = wk.map((p, i) => p == null ? '' :
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p).toFixed(1)}" r="${p === floor ? 2.8 : 1.8}" fill="${p === floor ? 'var(--floor)' : 'var(--muted)'}"><title>неделя с ${M.weeks[i]}: €${p}</title></circle>`).join('');
  const fl = `<line x1="${pad}" x2="${W - pad}" y1="${y(floor).toFixed(1)}" y2="${y(floor).toFixed(1)}" stroke="var(--floor)" stroke-dasharray="2 3" stroke-width="1" opacity=".55"/>`;
  return `<svg viewBox="0 0 ${W} ${H}">${fl}<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-linejoin="round"/>${dots}</svg>`;
}

function rowHtml(n) {
  const floor = n.s[0][0];
  const open = n.kids && state.open.has(n.key);
  const pad = 8 + n.lvl * (innerWidth < 760 ? 12 : 24);
  const kids = n.kids ? `<span class="kids">${n.kids.length} ${DIMS[n.kids[0].dim].unit}` +
    (n.lvl < SLICES[state.slice].dims.length - 2 ? ` · ${n.nleaf} конф.` : '') + `</span>` : '';
  return `<div class="row l${n.lvl} ${n.kids ? (open ? 'open' : '') : 'leaf'}" data-key="${esc(n.key)}">` +
    `<div class="name" style="padding-left:${pad}px"><span class="caret">${n.kids ? '▶' : ''}</span>${DIMS[n.dim].html(n.s0)}${kids}` +
    (n.eff != null ? `<span class="eff ${state.sort === 'eff' ? 'on' : ''}" title="${DIMS[n.dim].eft}">${DIMS[n.dim].ef(n.eff)}</span>` : '') + `</div>` +
    n.s.map((s, i) => priceCell(s, floor, i)).join('') +
    nowCell(n, floor) +
    `<div class="dist">${dist(n.hist)}</div>` +
    `<div class="spark">${spark(n.wk, floor)}</div>` +
    `<div class="cnt" title="лотов с ${fmtD(M.since)}">${n.s[0][2]}</div></div>` +
    (open ? n.kids.map(rowHtml).join('') : '');
}

function render() {
  const nodes = sortNodes(build());
  const sl = SLICES[state.slice];
  document.getElementById('path').textContent = sl.title;
  const head = `<div class="row head"><div>${sl.title}</div>` +
    `<div class="r">${WIN[0]}<small>дно</small></div><div class="r">30 дней<small>с ${fmtD(M.w30)}</small></div>` +
    `<div class="r">7 дней<small>с ${fmtD(M.w7)}</small></div><div class="r cur-c">сейчас<small>висит</small></div>` +
    `<div class="dist">распределение<small>дно … +60%, <span style="color:var(--accent)">7 дней</span></small></div>` +
    `<div class="spark">по неделям<small>min недели</small></div><div class="r cnt">лотов</div></div>`;
  document.getElementById('t').innerHTML = head + (nodes.length ? nodes.map(rowHtml).join('') : '<div class="empty">ничего не подошло под фильтр</div>');
}

function openAll(nodes, depth) {
  for (const n of nodes) if (n.kids && n.lvl < depth) { state.open.add(n.key); openAll(n.kids, depth); }
}

document.getElementById('t').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row || row.classList.contains('leaf') || row.classList.contains('head') || !e.target.closest('.name')) return;
  const k = row.dataset.key;
  state.open.has(k) ? state.open.delete(k) : state.open.add(k);
  render();
});
document.getElementById('q').addEventListener('input', e => {
  state.q = e.target.value;
  // при поиске раскрываем всё, кроме последнего уровня с листьями — иначе совпадения спрятаны
  if (state.q.trim()) openAll(build(), SLICES[state.slice].dims.length - 1);
  render();
});
function seg(id, fn) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    fn(b.dataset.k);
    for (const x of e.currentTarget.children) x.classList.toggle('on', x === b);
    render();
  });
}
seg('sort', k => { state.sort = k; });
seg('score', k => { state.score = +k; });
seg('band', k => { state.band = +k; document.querySelectorAll('.bandv').forEach(x => x.textContent = `+${k}%`); });
seg('slice', k => { state.slice = k; if (state.q.trim()) openAll(build(), SLICES[k].dims.length - 1); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const f = c.dataset.f;
  state.f.has(f) ? state.f.delete(f) : state.f.add(f);
  if (f === 'gpu' && state.f.has('gpu')) state.f.delete('nogpu');
  if (f === 'nogpu' && state.f.has('nogpu')) state.f.delete('gpu');
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', state.f.has(x.dataset.f)));
  render();
}));
document.getElementById('expand').onclick = () => { openAll(build(), 99); render(); };
document.getElementById('collapse').onclick = () => { state.open.clear(); render(); };

document.getElementById('sub').innerHTML =
  `Срез <b>${M.now.replace('T', ' ').slice(0, 16)} UTC</b> · <b>${M.lots.toLocaleString('ru')}</b> лотов с ${fmtD(M.since)} · ` +
  `<b>${DATA.tree.length}</b> процессоров, <b>${LEAVES.length}</b> конфигураций. Свёрнутая строка показывает минимум по всему, что внутри.`;
document.getElementById('foot').innerHTML =
  `Лот попадает в окно, если висел в нём хоть минуту; цена — минимальная за время, что он висел. ` +
  `Евро в месяц. Недели считаются с понедельника ${fmtD(M.since)}. ` +
  `Рейтинг процессоров — многопоток PassMark CPU Mark или медиана Geekbench 6, снятые ${fmtD(M.scoreDate)}. ` +
  `Класс дисков — набор типов без объёма: «NVMe DC + HDD» значит, что в машине есть и те и другие.`;
render();
</script>
</body>
</html>
